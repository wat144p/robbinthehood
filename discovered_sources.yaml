  notes: >-
    APPROVED, but NOT wired in yet on purpose. Checked the feed live on
    2026-08-19: it's PC Gamer's entire site output (reviews, esports news,
    mods, guides), not a deals feed — of the first 40 items, ~7 loosely
    mentioned a price, and those were editorial articles ("SSD prices are
    rising"), not purchasable listings with a real deal price and link.
    Wiring it in the same way as OzBargain would flood the digest with
    unrelated articles, not deals. Have not found a dedicated PC Gamer deals
    feed (checked several likely paths, all 404). If you want this source,
    it needs either (a) a real deals-only feed/tag URL, found by hand rather
    than guessed, or (b) a much stricter filter than the other RSS sources
    use, and even then every hit should be treated as a claim to verify
    against a retailer, not a confirmed price.
